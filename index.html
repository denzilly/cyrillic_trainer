<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Russian Transliteration Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header>
      <div class="title">Russian <span>→</span> Latin Trainer</div>
      <div class="header-right">
        <div class="stats">
          <div class="stat">
            Score: <span class="stat-value" id="score">0</span>/<span class="stat-value" id="total-answered">0</span>
          </div>
          <div class="stat">
            🔥 <span class="stat-value streak" id="streak">0</span>
          </div>
        </div>
        <div class="auth-section">
          <button class="auth-signin-btn" id="auth-signin-btn" onclick="signIn()">Sign in</button>
          <div class="auth-user-widget" id="auth-user-widget" style="display:none">
            <img class="auth-photo" id="auth-photo" src="" alt="">
            <button class="auth-name-btn" id="auth-name" onclick="changeNickname()" title="Change nickname"></button>
            <button class="auth-signout-btn" onclick="signOutUser()">Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="lang-selector">
      <button class="lang-btn active" data-lang="ru">🇷🇺 Russian</button>
      <button class="lang-btn" data-lang="el">🇬🇷 Greek</button>
      <button class="lang-btn" data-lang="ko">🇰🇷 Korean</button>
      <button class="lang-btn" data-lang="ja">🇯🇵 Japanese</button>
    </div>

    <div class="toolbar">
      <button class="toolbar-btn" onclick="openWordList()">📚 Word list</button>
      <button class="toolbar-btn" id="ref-toggle-btn">Аа Alphabet</button>
      <button class="toolbar-btn" onclick="openLeaderboard(currentLang)">🏆 Leaderboard</button>
    </div>

    <div class="ref-panel">
      <h3>Cyrillic Alphabet Transliteration Guide</h3>
      <div class="ref-grid"></div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="word-count" id="word-count">Word 1 of …</div>

    <div class="card" id="game-card">
      <div class="category-badge" id="category-badge">Category</div>
      <div class="russian-word" id="russian-word">…</div>

      <div class="input-area">
        <input
          type="text"
          id="answer-input"
          placeholder="Type the transliteration…"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        >
        <button id="submit-btn">Check</button>
      </div>

      <div class="result hidden" id="result">
        <div class="result-status" id="result-status"></div>
        <div class="result-details" id="result-details"></div>
        <div class="english-meaning" id="english-meaning"></div>
        <button id="next-btn">Next →</button>
      </div>
    </div>

    <div class="hint-area" id="hint-area">
      <button id="hint-btn">Show hint</button>
      <div class="hint-text hidden" id="hint-text"></div>
    </div>

    <div class="end-screen hidden" id="end-screen">
      <h2>Round Complete!</h2>
      <div class="final-score" id="final-score">—</div>
      <div class="final-pct" id="final-pct"></div>
      <div class="final-msg" id="final-msg"></div>
      <div class="final-streak" id="final-streak"></div>
      <div class="save-status" id="save-status"></div>
      <div class="end-btns">
        <button id="restart-btn">Play Again</button>
        <button class="lb-btn-end" onclick="openLeaderboard(currentLang)">🏆 Leaderboard</button>
      </div>
    </div>

  </div>

  <!-- Word List Modal -->
  <div class="wordlist-modal" id="wordlist-modal">
    <div class="wordlist-card">
      <div class="wordlist-header">
        <span>📚 Word Categories</span>
        <button class="lb-close" onclick="closeWordList()">✕</button>
      </div>
      <div class="wordlist-subheader">
        <span id="wordlist-count"></span>
        <button class="wordlist-selectall" onclick="selectAllCategories()">Select all</button>
      </div>
      <div class="wordlist-categories" id="wordlist-categories"></div>
      <div class="wordlist-footer">
        <button class="wordlist-done" onclick="closeWordList()">Done</button>
      </div>
    </div>
  </div>

  <!-- Nickname Modal -->
  <div class="nickname-modal" id="nickname-modal">
    <div class="nickname-card">
      <h3 id="nickname-modal-title">Choose a nickname</h3>
      <p>This is what appears on the leaderboard — your real name stays private.</p>
      <input
        type="text"
        id="nickname-input"
        placeholder="e.g. CoolLearner99"
        maxlength="20"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      >
      <div class="nickname-error" id="nickname-error"></div>
      <button class="nickname-submit" id="nickname-submit-btn" onclick="submitNickname()">Save</button>
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div class="lb-modal" id="lb-modal">
    <div class="lb-card">
      <div class="lb-header">
        <span id="lb-header-title">🏆 Russian Leaderboard</span>
        <button class="lb-close" onclick="closeLeaderboard()">✕</button>
      </div>
      <div class="lb-cols">
        <span></span><span></span>
        <span>Player</span><span>Best Streak</span>
      </div>
      <div class="lb-body" id="lb-body"></div>
      <div class="lb-personal" id="lb-personal"></div>
    </div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="firebase-app.js"></script>
  <script src="words_ru.js"></script>
  <script src="words_el.js"></script>
  <script src="words_ko.js"></script>
  <script src="words_ja.js"></script>
  <script src="game.js"></script>
</body>
</html>
